# Pretty public routes — keep in sync with app/Core/route_registry.php
location = / {
    rewrite ^ /index.php last;
}

location = /login { rewrite ^ /login.php last; }
location = /register { rewrite ^ /register.php last; }
location = /logout { rewrite ^ /logout.php last; }
location = /about { rewrite ^ /about.php last; }
location = /faq { rewrite ^ /faq.php last; }
location = /help-us { rewrite ^ /help-us.php last; }
location = /contact { rewrite ^ /contact.php last; }
location = /report { rewrite ^ /report.php last; }
location = /incident-report { rewrite ^ /incident-report.php last; }
location = /privacy { rewrite ^ /privacy.php last; }
location = /terms { rewrite ^ /terms.php last; }
location = /search { rewrite ^ /search.php last; }
location = /bookmarks { rewrite ^ /bookmarks.php last; }
location = /challenges { rewrite ^ /challenges.php last; }
location = /announcements { rewrite ^ /announcements.php last; }
location = /notifications { rewrite ^ /notifications.php last; }
location = /support { rewrite ^ /support.php last; }
location = /forgot-password { rewrite ^ /forgot-password.php last; }
location = /reset-password { rewrite ^ /reset-password.php last; }
location = /verify-email { rewrite ^ /verify-email.php last; }
location = /resend-verification { rewrite ^ /resend-verification.php last; }
location = /settings/profile { rewrite ^ /edit-profile.php last; }
location = /settings/delete-account { rewrite ^ /delete-account.php last; }
location ~ ^/settings/([a-z0-9_-]+\.php)$ { rewrite ^ /$1 last; }

location ~ ^/profile/([0-9]+)/?$ {
    rewrite ^ /profile.php?id=$1 last;
}

