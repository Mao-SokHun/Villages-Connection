# First deploy: HTTP only (Let's Encrypt webroot challenge).
# After SSL: switch NGINX_CONF=production.conf in .env and restart web.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 128M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/pretty-routes.conf;

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/post/([A-Za-z0-9\-]+)/?$ {
        try_files $uri /post.php?slug=$1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.php;

    location ~ \.php$ {
        client_max_body_size 128M;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
        }
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
