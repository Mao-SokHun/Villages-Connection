# Production — nginx + PHP-FPM (listens on $PORT for Koyeb, Render, etc.)
server {
    listen __PORT__;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 512M;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    include /etc/nginx/snippets/pretty-routes.conf;

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/post/([^/]+)/?$ {
        try_files $uri /post.php?slug=$1;
    }

    location = /post {
        rewrite ^ /post.php?$query_string last;
    }

    location = /413.html {
        root /var/www/html/public;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 413 /413.html;
    error_page 404 /404.php;

    location ~ \.php$ {
        client_max_body_size 512M;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 600;
    }

    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
        }
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
