# Production on a VPS (Oracle Cloud Always Free, etc.)
# Uses Dockerfile.prod (nginx + PHP in one container).
# Database: Supabase or Neon — set DB_* in .env (no local Postgres).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: villages_connection_web
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      TRUST_PROXY: "true"
