<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload too large</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 1.5rem;
        }
        .card {
            max-width: 32rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
        }
        h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
        p { margin: 0 0 1rem; color: #94a3b8; line-height: 1.6; }
        ul { text-align: left; color: #cbd5e1; margin: 0 0 1.25rem; padding-left: 1.25rem; }
        a {
            display: inline-block;
            padding: 0.65rem 1.1rem;
            border-radius: 999px;
            background: #6366f1;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Upload too large (413)</h1>
        <p>The file you tried to upload exceeds the server limit.</p>
        <ul>
            <li>Images: up to 5 MB</li>
            <li>Videos: up to 500 MB and 6 minutes</li>
            <li>Total request must stay under 512 MB</li>
        </ul>
        <p>Compress the file or choose a smaller one, then try again.</p>
        <a href="javascript:history.back()">Go back</a>
    </div>
</body>
</html>
