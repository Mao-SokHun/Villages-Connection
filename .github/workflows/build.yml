name: Laravel Docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build Containers
        run: docker compose up -d --build

      - name: Install Composer Dependencies
        run: docker compose exec -T app composer install --no-interaction --prefer-dist

      - name: Run Migrations
        run: docker compose exec -T app php artisan migrate --force

      - name: Clear Cache
        run: docker compose exec -T app php artisan optimize:clear

      - name: Verify Laravel
        run: docker compose exec -T app php artisan --version