<script>
        // Simple micro-interactions for the UI
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.querySelector('textarea');
            const charCount = document.querySelector('.text-label-md.text-secondary');
            
            textarea.addEventListener('input', (e) => {
                const length = e.target.value.length;
                charCount.textContent = `${length} / 2200`;
                
                if (length > 2200) {
                    charCount.classList.add('text-error');
                } else {
                    charCount.classList.remove('text-error');
                }
                
                // Auto-expand textarea
                textarea.style.height = 'auto';
                textarea.style.height = textarea.scrollHeight + 'px';
            });

            // Handle Post Button Click
            const postBtn = document.querySelector('button.bg-primary');
            postBtn.addEventListener('click', () => {
                postBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span>`;
                postBtn.classList.add('opacity-70', 'pointer-events-none');
                
                setTimeout(() => {
                    postBtn.innerHTML = `<span class="material-symbols-outlined">check</span>`;
                    postBtn.classList.replace('bg-primary', 'bg-green-500');
                    alert('Post successfully created!');
                }, 1500);
            });
        });
    </script>
