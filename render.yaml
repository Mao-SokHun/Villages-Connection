# Render Blueprint — Villages Connection (free web + Supabase)
# Dashboard: New → Blueprint → connect GitHub repo
# Docs: https://render.com/docs/blueprint-spec
#
# Database: use Supabase (free) — enter DB_* secrets when Blueprint prompts.
# Uploads: use Cloudinary (free tier has no persistent disk).

services:
  - type: web
    name: villages-connection
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    region: singapore
    healthCheckPath: /health.php
    envVars:
      - key: APP_NAME
        value: Village Connect
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Asia/Phnom_Penh
      - key: APP_URL
        sync: false
      - key: TRUST_PROXY
        value: true
      - key: PRETTY_URLS
        value: true
      - key: RATE_LIMIT_DRIVER
        value: database
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Village Connect
      - key: SITE_CONTACT_EMAIL
        sync: false
      - key: OAUTH_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: village-connect
