services:
  db:
    image: postgres:16-alpine
    container_name: project_cms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_cms
      POSTGRES_USER: postgres
      # Local Docker password only — do not reuse Supabase DB_PASSWORD from .env (volume keeps its own password).
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-localdev_cms_password}
      TZ: ${APP_TIMEZONE:-Asia/Phnom_Penh}
      PGTZ: ${APP_TIMEZONE:-Asia/Phnom_Penh}
    # pgAdmin / local tools: host 127.0.0.1:5433 → container 5432
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: project_cms_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/production.ini:ro
    env_file:
      - .env
    environment:
      # Local Docker must use the bundled Postgres — not Supabase/Neon from .env (remote DB adds ~1–3s per page).
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: project_cms
      DB_USERNAME: postgres
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-localdev_cms_password}
      DB_SSLMODE: ""
      SESSION_DRIVER: file
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy
        required: false

  web:
    image: nginx:alpine
    container_name: project_cms_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - app

volumes:
  postgres_data:
