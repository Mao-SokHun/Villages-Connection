services:
  db:
    image: postgres:16-alpine
    container_name: project_cms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4944
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: project_cms_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: project_cms
      DB_USERNAME: postgres
      DB_PASSWORD: 4944
      APP_URL: "http://localhost:8080"
      APP_DEBUG: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: noreply@villagenews.local
      MAIL_FROM_NAME: Village Connect
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit
    container_name: project_cms_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    image: nginx:alpine
    container_name: project_cms_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
